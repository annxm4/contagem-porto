<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumo a Porto Seguro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: uma coluna. Fundo verde menta, cartão claro com o contador. Um único visual, sem tema escuro. */
:root {
  --bg: #b4ebcd;
  --surface: #f6fdf9;
  --fg: #073323;
  --muted: #1d5a42;
  --teal: #0a4a33;
  --line: #8fd3b0;
  --sun: #ffc233;
  --ink: #3a2300;
  --unit: #e3f6eb;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 36px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
.eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); font-weight: 700; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 9vw, 48px); line-height: 1.02; margin: 6px 0 8px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; font-weight: 500; }
.card { background: var(--surface); border: 2px solid var(--teal); border-radius: 14px; padding: 20px 18px; display: grid; gap: 16px; }
.card h2 { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin: 0; }
.units { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.unit { text-align: center; padding: 12px 2px 10px; border-radius: 10px; background: var(--unit); }
.num { display: block; font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 10vw, 46px); line-height: 1; font-variant-numeric: tabular-nums; }
.lab { display: block; margin-top: 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.unit:first-child { background: var(--sun); color: var(--ink); }
.unit:first-child .lab { color: var(--ink); }
.bar { height: 12px; background: var(--unit); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.fill { height: 100%; width: 0; background: var(--teal); border-radius: 99px; transition: width .6s ease; }
.barlab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.done { font-family: var(--font-display); font-weight: 800; font-size: 26px; text-align: center; padding: 14px 0; }
footer { color: var(--muted); font-size: 13px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

</head>
<body>
<main>
  <header>
    <p class="eyebrow">Porto Seguro · Bahia</p>
    <h1>Falta pouco para os dias em Porto</h1>
    <p class="lead">Saída no sábado, 26 de dezembro, às 7h10 da manhã.</p>
  </header>

  <section class="card" aria-labelledby="t1">
    <h2 id="t1">Falta para a saída</h2>
    <div class="units" id="c1">
      <div class="unit"><span class="num" data-u="d">0</span><span class="lab">dias</span></div>
      <div class="unit"><span class="num" data-u="h">00</span><span class="lab">horas</span></div>
      <div class="unit"><span class="num" data-u="m">00</span><span class="lab">min</span></div>
      <div class="unit"><span class="num" data-u="s">00</span><span class="lab">seg</span></div>
    </div>
    <div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div class="fill" id="fill"></div></div>
      <div class="barlab"><span>13/11</span><span id="pct">0%</span><span>26/12</span></div>
    </div>
  </section>

  <footer>Contagem no horário de Brasília</footer>
</main>

<script>
(function () {
  var START = new Date("2026-11-13T00:00:00-03:00").getTime();
  var DEPART = new Date("2026-12-26T07:10:00-03:00").getTime();

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function render(id, target, doneText) {
    var box = document.getElementById(id);
    var diff = target - Date.now();
    if (diff <= 0) {
      box.className = "done";
      box.textContent = doneText;
      return;
    }
    var t = Math.floor(diff / 1000);
    var vals = { d: Math.floor(t / 86400), h: pad(Math.floor(t % 86400 / 3600)), m: pad(Math.floor(t % 3600 / 60)), s: pad(t % 60) };
    var nodes = box.querySelectorAll("[data-u]");
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = vals[nodes[i].getAttribute("data-u")];
  }

  function tick() {
    render("c1", DEPART, "Já estamos a caminho!");
    var p = Math.max(0, Math.min(1, (Date.now() - START) / (DEPART - START)));
    var pct = Math.round(p * 100);
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("pct").textContent = pct + "%";
    document.getElementById("bar").setAttribute("aria-valuenow", pct);
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
